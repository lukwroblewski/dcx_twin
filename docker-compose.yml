networks:
  ot_internal:
    internal: true
  data_internal:
    internal: true
  edge_public:
    driver: bridge

services:
  cdu-simulator:
    build: ./cdu_simulator
    container_name: dcx-cdu-simulator
    networks:
      - ot_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: dcx-influxdb
    networks:
      - data_internal
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD:-dcx-local-influx-pass}
      - DOCKER_INFLUXDB_INIT_ORG=dcx
      - DOCKER_INFLUXDB_INIT_BUCKET=cdu_telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN:-dcx-local-influx-token}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped

  edge-gateway:
    build: ./edge_gateway
    container_name: dcx-edge-gateway
    networks:
      - ot_internal
      - data_internal
      - edge_public
    environment:
      - MODBUS_HOST=cdu-simulator
      - MODBUS_PORT=5020
      - POLL_INTERVAL_SEC=1.0
      - REDFISH_API_KEY=${REDFISH_API_KEY:-dcx-local-redfish-key}
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN:-dcx-local-influx-token}
      - INFLUX_ORG=dcx
      - INFLUX_BUCKET=cdu_telemetry
    ports:
      - "8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - cdu-simulator
      - influxdb
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: dcx-grafana
    networks:
      - data_internal
      - edge_public
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-dcx-local-grafana-pass}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - INFLUX_TOKEN=${INFLUX_TOKEN:-dcx-local-influx-token}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - influxdb
    restart: unless-stopped

volumes:
  influxdb_data: