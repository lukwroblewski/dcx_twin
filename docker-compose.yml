services:
  cdu-simulator:
    build: ./cdu_simulator
    container_name: dcx-cdu-simulator
    ports:
      - "5020:5020"
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: dcx-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=dcxadminpass
      - DOCKER_INFLUXDB_INIT_ORG=dcx
      - DOCKER_INFLUXDB_INIT_BUCKET=cdu_telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=dcx-super-secret-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped

  edge-gateway:
    build: ./edge_gateway
    container_name: dcx-edge-gateway
    environment:
      - MODBUS_HOST=cdu-simulator
      - MODBUS_PORT=5020
      - POLL_INTERVAL_SEC=1.0
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=dcx-super-secret-token
      - INFLUX_ORG=dcx
      - INFLUX_BUCKET=cdu_telemetry
    ports:
      - "8000:8000"
    depends_on:
      - cdu-simulator
      - influxdb
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: dcx-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - influxdb
    restart: unless-stopped

volumes:
  influxdb_data: