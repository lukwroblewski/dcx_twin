apiVersion: 1

datasources:
  - name: InfluxDB_CDU
    uid: influxdb-cdu
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: dcx
      defaultBucket: cdu_telemetry
      tlsSkipVerify: true
    secureJsonData:
      token: $INFLUX_TOKEN